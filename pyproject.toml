[project]
name = "fireredaudio"
version = "0.1.0"
description = "FireRedAudio inference: ASR, audio understanding, TTS, speech editing, voice design"
readme = "README.md"
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.1",
    "transformers==5.8.0",
    "numpy==2.2.6",
    "einops==0.8.2",
]

[project.optional-dependencies]
accel = [
    "flash-linear-attention==0.5.0",
    "liger-kernel==0.8.0",
]
accel-build = [
    "causal-conv1d==1.6.2.post1",
    "flash-attn==2.8.3",
]

[dependency-groups]
tools = ["tqdm==4.67.3"]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
torchcodec = [{ index = "pytorch-cu128" }]
